:["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"lineage","title":"Nine of twelve reports must move, and eight never typed a deprecated name"},"level":"analyze","pool":"practice"},{"id":"q-d1-maturity-03","type":"single","prompt":"On 1 July 2026 a manager asks for the certified collection rate of May 2026 bills, which were due on 24 June. What should the layer return?","options":[{"key":"A","text":"No figure yet: the cohort matures when due date plus 30 days has passed"},{"key":"B","text":"The rate so far, since it is the most recent information"},{"key":"C","text":"April's rate, as the latest complete month, under May's name"},{"key":"D","text":"The finance cash rate for May, which is already complete"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A cohort metric whose window has not closed would show a false collapse; the layer reports it only after the window.","misconceptions":["","A partial window understates the rate and looks like a collapse","Labels another month's figure as May's","Substitutes a metric with another meaning"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"maturity","title":"A cohort metric is not reported until its window has closed"},"level":"apply","pool":"practice"},{"id":"q-d1-ratio-04","type":"single","prompt":"Business accounts collect 85.6% of SAR 2.0 million, consumers 91.1% of SAR 3.5 million and government 50.6% of SAR 0.5 million. What is the company's collection rate?","options":[{"key":"A","text":"75.8%, the average of the three rates"},{"key":"B","text":"91.1%, the rate of the largest segment"},{"key":"C","text":"50.6%, the most cautious of the three"},{"key":"D","text":"About 85.6%, the total collected over the total due"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A ratio is computed after aggregation: total collected over total net due weights each segment by its money.","misconceptions":["Gives government, a tenth of the money, a third of the weight","Ignores the other two segments","Chooses a figure by caution, not by definition",""],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"ratio-of-sums","title":"A ratio is divided after aggregation, never averaged across parts"},"level":"apply","pool":"practice"},{"id":"q-d1-rename-09","type":"single","prompt":"Customer care's paid_on_time_rate counts bills paid in full by the due date. The council certified a value-based collection rate. What should happen to the care metric?","options":[{"key":"A","text":"Replace it with the certified collection rate in the care scorecard"},{"key":"B","text":"Delete it, since only one collection rate may exist"},{"key":"C","text":"Keep it as it is, under the same name"},{"key":"D","text":"Rename it for what it measures and keep it, with the old name deprecated"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It answers another question (bills paid on time, by count); it keeps its own meaning under a name that does not claim to be the collection rate.","misconceptions":["Changes what the care scorecard measures without its owner deciding it","Loses a useful measure of customer behaviour","Leaves two different meanings under one familiar name",""],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"deprecate-with-successor","title":"Deprecate with a successor and a date, and rename what was never a duplicate"},"level":"evaluate","pool":"practice"},{"id":"q-d1-test-05","type":"tf","prompt":"A reconciliation test compares a metric computed through the semantic layer with a total computed by SQL directly on the marts. It can catch a filter that was dropped from the metric.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The independent SQL keeps the filter, so the metric's total no longer matches it, as Lab 1.2 shows with the maturity filter.","misconceptions":["","Assumes a test written by the same team cannot disagree with the metric"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"reconcile-tests","title":"A reconciliation test compares the metric with SQL that bypasses the layer"},"level":"understand","pool":"practice"},{"id":"q-d1-version-06","type":"single","prompt":"A steward adds an Arabic synonym to the certified metric billed_amount, version 2.0.0. Which version should the change carry?","options":[{"key":"A","text":"3.0.0, since every change to a certified metric is major"},{"key":"B","text":"2.0.1, a patch: the words changed, the number did not"},{"key":"C","text":"2.1.0, a minor change for a new field"},{"key":"D","text":"2.0.0, since a synonym is not a change"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Words only (description, label, synonyms) is a patch: every reader's number stays the same.","misconceptions":["Treats every edit as a change of meaning","","A synonym is not a new field of the metric","Every change needs a version, or readers cannot tell what changed"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"semver","title":"The version says whether a reader's number will move"},"level":"apply","pool":"practice"},{"id":"q-d1-walk-01","type":"single","prompt":"A walk from the finance collection rate to the collections rate has four steps. Which step should be fixed in the data rather than decided by the metrics council?","options":[{"key":"A","text":"Shortening the window from 60 to 30 days after the due date"},{"key":"B","text":"Taking disputed amounts out of the denominator"},{"key":"C","text":"Removing a payment batch that was loaded twice"},{"key":"D","text":"Measuring a cohort of the month's bills instead of the month's cash"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A payment loaded twice is a data error: it is wrong under every definition, so it is fixed once in the payment data.","misconceptions":["A window is a definition choice the council makes on criteria","Whether disputes count is a policy choice, not an error","","The population measured is a definition choice"],"lo":["LO2"],"day":1,"session":1,"slide":{"deck":"day1","id":"walk","title":"A walk turns one argument into four separate decisions"},"level":"analyze","pool":"practice"},{"id":"q-d2-asof-03","type":"single","prompt":"Data used by plan adds up to 1.6 times the company total after two plans changed price. What change to the model fixes it?","options":[{"key":"A","text":"Join the tariff history on its code and the validity dates around the usage month"},{"key":"B","text":"Divide each plan's figure by the number of its tariff rows"},{"key":"C","text":"Remove the old tariff rows from the history table"},{"key":"D","text":"Group by the tariff key instead of the plan name"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A type 2 history needs an as-of join: the row valid on the fact's date, so each line matches one tariff row.","misconceptions":["","Scaling hides the duplication and is wrong for lines active in one period only","Loses the history that older months need","Splits a plan into its price periods without removing the duplication"],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"day2","id":"tariff-history","title":"A price change makes two tariff rows; the join must pick the one valid that month"},"level":"apply","pool":"practice"},{"id":"q-d2-deny-08","type":"single","prompt":"A new roaming dataset is added without a row rule. Which layer behaviour is safest for the regional manager's role?","options":[{"key":"A","text":"Refuse the query with an error naming the missing rule"},{"key":"B","text":"Return all regions until a rule is written"},{"key":"C","text":"Return the Eastern region by guessing the rule from the customer join"},{"key":"D","text":"Return the rows with every value masked"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Deny by default turns a forgotten rule into a visible error for one role instead of a silent leak.","misconceptions":["","Leaks every region silently","A guessed rule is an untested rule","Masking values is not filtering rows"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"fix-the-cause","title":"Fix the cause: a rule per dataset, deny by default, classify by lineage"},"level":"apply","pool":"practice"},{"id":"q-d2-drill-02","type":"tf","prompt":"A semantic layer answers billing and complaints by region and month by aggregating each fact on its own and then joining the two results on region and month. This keeps each figure equal to what it would be alone.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each side has one row per key after aggregation, so the join repeats nothing: that is drill-across.","misconceptions":["","Assumes any join of two facts multiplies rows"],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"day2","id":"drill-across","title":"Drill across: aggregate each fact alone, then join on the shared keys"},"level":"understand","pool":"practice"},{"id":"q-d2-fanout-01","type":"single","prompt":"An analyst joins customers to their bills and to their complaints in one query and groups by region. Billing comes out 1.5 times the source total and complaints 13 times. Why are complaints inflated more?","options":[{"key":"A","text":"Complaints are counted with DISTINCT and bills are not"},{"key":"B","text":"Each complaint repeats once per bill of its customer, and customers have many more bills than complaints"},{"key":"C","text":"The complaint table has duplicate rows in the source"},{"key":"D","text":"Complaints are dated by opening day and bills by service month"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"In a wide join each row of one fact repeats once per matching row of the other; a customer has up to 18 bills but few complaints.","misconceptions":["DISTINCT is not in the query, and would not fix a sum anyway","","The source total is the reference the factor is computed against","Different dates change the grouping, not the row count"],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"day2","id":"wide-join","title":"One wide join multiplies both figures"},"level":"analyze","pool":"practice"},{"id":"q-d2-leak-06","type":"single","prompt":"An access test shows the Eastern regional manager the complaints of all five regions, while billing and collections are correctly limited. What is the most likely cause?","options":[{"key":"A","text":"The manager's role allows all regions"},{"key":"B","text":"The complaint dataset has no row rule and the layer allows by default"},{"key":"C","text":"Complaints are masked instead of filtered"},{"key":"D","text":"The dashboard's region filter was removed"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A dataset without a rule is unfiltered when the layer allows by default; the other areas show the role itself is right.","misconceptions":["Then billing would show all regions too","","Masking hides field values, it does not remove rows","The test asks the layer directly, not through a dashboard"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"two-leaks","title":"Three of 21 tests fail, and they point at two leaks"},"level":"analyze","pool":"practice"},{"id":"q-d2-lineage-07","type":"single","prompt":"A field contact_name takes the first word of the Restricted full name and carries no classification tag. How should the layer treat it?","options":[{"key":"A","text":"As unrestricted, since only first names are shown"},{"key":"B","text":"As unrestricted until someone tags it"},{"key":"C","text":"As Restricted, because its expression reads a Restricted column"},{"key":"D","text":"As Public, because first names are common"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Classification follows lineage: a value derived from a Restricted column is Restricted, whatever its name or tag.","misconceptions":["First names with region and city can identify a person","Relies on someone remembering to tag every derived field","","Commonness does not change where the value comes from"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"fix-the-cause","title":"Fix the cause: a rule per dataset, deny by default, classify by lineage"},"level":"evaluate","pool":"practice"},{"id":"q-d2-port-09","type":"single","prompt":"After exporting the model to Ossie and running it on SQLite, which failure is the most dangerous?","options":[{"key":"A","text":"A query that stops with 'no such function: split_part'"},{"key":"B","text":"A query that stops with 'no such function: date_diff'"},{"key":"C","text":"A query on a cumulative metric that the export left behind"},{"key":"D","text":"A query that runs and puts the whole amount in one row with an empty month"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A query that runs and returns a plausible but wrong figure reaches a slide; errors are seen and fixed.","misconceptions":["A loud error is noticed at once","A loud error is noticed at once, whatever the missing function","A missing metric is visible, not wrong",""],"lo":["LO1"],"day":2,"session":4,"slide":{"deck":"day2","id":"second-engine","title":"On a second engine, two queries fail loudly and one is quietly wrong"},"level":"analyze","pool":"practice"},{"id":"q-d2-preagg-04","type":"single","prompt":"Lines with a session are 3,253 for the fiscal year, but adding the twelve monthly counts gives 31,226. What does this mean for a monthly pre-aggregation of that metric?","options":[{"key":"A","text":"It can serve yearly questions if divided by twelve"},{"key":"B","text":"It can serve any question grouped by month or coarser"},{"key":"C","text":"It is safe if refreshed every night"},{"key":"D","text":"It cannot serve a coarser question: a distinct count does not roll up"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A line active in many months is counted once per month; only sums and counts can be re-added from a coarser table.","misconceptions":["Lines are not active in exactly twelve months each","Months are fine; anything coarser re-adds distinct counts","Freshness does not fix double counting",""],"lo":["LO1"],"day":2,"session":2,"slide":{"deck":"day2","id":"cannot-roll-up","title":"A distinct count cannot be summed from a coarser table"},"level":"apply","pool":"practice"},{"id":"q-d2-rows-05","type":"single","prompt":"Two teams compare their pre-aggregation designs on different laptops. Which measure lets them compare fairly?","options":[{"key":"A","text":"Milliseconds per query, the median of several runs"},{"key":"B","text":"Rows scanned per query"},{"key":"C","text":"Milliseconds of the first run, before any cache"},{"key":"D","text":"Number of pre-aggregation tables"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Rows scanned does not depend on the machine or the cache, and predicts cost on a warehouse that bills by data scanned.","misconceptions":["Latency depends on each laptop","","A cold first run is still machine-dependent","Fewer tables can mean slower or faster queries"],"lo":["LO1"],"day":2,"session":2,"slide":{"deck":"day2","id":"preagg-results","title":"Four pre-aggregations cut rows scanned by 92% and latency by 84%"},"level":"evaluate","pool":"practice"},{"id":"q-d2-travel-10","type":"single","prompt":"Which part of the Qamar layer does the Ossie core specification carry between tools?","options":[{"key":"A","text":"The access rules and roles"},{"key":"B","text":"The metrics' SQL, the datasets and their relationships"},{"key":"C","text":"The reconciliation tests"},{"key":"D","text":"The cumulative fiscal-year-to-date metric"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The core holds datasets, fields, relationships and model-scoped metrics; access rules, tests and windows over time stay behind.","misconceptions":["Access rules are not in the core","","Tests are not part of the document","The core has no window over time"],"lo":["LO1"],"day":2,"session":4,"slide":{"deck":"day2","id":"not-travelled","title":"Definitions travel; governance and some logic stay behind"},"level":"understand","pool":"practice"},{"id":"q-d3-ablate-04","type":"single","prompt":"A team removes both synonyms and examples in one run and accuracy drops 30 points. What can they conclude?","options":[{"key":"A","text":"Synonyms and examples matter equally"},{"key":"B","text":"Examples matter more than synonyms"},{"key":"C","text":"The two kinds together matter, but not how much each contributes"},{"key":"D","text":"Descriptions matter least"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Changing two things at once mixes their effects; one kind at a time gives each drop one cause.","misconceptions":["The run cannot separate them","The run cannot separate them","","Descriptions were not removed"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"ablation","title":"Remove one kind of context at a time, and keep everything else fixed"},"level":"evaluate","pool":"practice"},{"id":"q-d3-answer-01","type":"single","prompt":"A certified question records only its value, 0.8645. Six months later the collection rate metric moves to version 2.0.0. What can the platform team no longer do?","options":[{"key":"A","text":"Re-run the question on the new version"},{"key":"B","text":"Tell whether the old value came from version 1 and which filters it used"},{"key":"C","text":"Score the assistant on that question"},{"key":"D","text":"Translate the question into Arabic"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Without the metric, version, filters and grain, nobody can check or re-certify the value when the definition changes.","misconceptions":["The question text can still be re-run; what is lost is what it should be compared with","","Scoring needs only a value, which is still there","Language has nothing to do with the record"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"certified-answer","title":"A certified answer is a figure and the four things that produce it"},"level":"understand","pool":"practice"},{"id":"q-d3-cache-10","type":"single","prompt":"An assistant caches the first answer to each question. Its unstable questions were all right on the first run. What does the cache do to the team's view of quality?","options":[{"key":"A","text":"Nothing: cached answers are right"},{"key":"B","text":"It hides the instability, so a model or cache change can bring wrong answers back unseen"},{"key":"C","text":"It fixes the instability for good"},{"key":"D","text":"It makes the stable wrong answers right"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Users see one answer, so stability looks perfect until the cache is cleared or the model changes.","misconceptions":["Right today, not after the next change","","Clearing the cache brings it back","A cache repeats a wrong answer too"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"cache-vote","title":"A cache hides instability; a vote of three does not fix it"},"level":"evaluate","pool":"practice"},{"id":"q-d3-coverage-02","type":"single","prompt":"A certified set of 44 questions has no difficulty 3 question for collections or complaints, and its only two refusals are about personal data. An assistant scores 97% on it. What does the score most likely overstate?","options":[{"key":"A","text":"Its accuracy on simple Arabic questions"},{"key":"B","text":"Its accuracy on rankings, cumulative figures and Hijri periods, and how often it refuses forecasts or draft metrics"},{"key":"C","text":"Its speed on long questions"},{"key":"D","text":"Its accuracy on billing questions"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The missing cells are the hardest questions and most kinds of refusal, exactly where assistants fail.","misconceptions":["Simple questions are well covered","","The set does not measure speed","Billing is covered at every difficulty"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"coverage","title":"The supplied 44 questions leave two cells empty and almost no refusals"},"level":"analyze","pool":"practice"},{"id":"q-d3-execute-07","type":"tf","prompt":"The harness compares the figure returned by the layer, not the text of the query. Two replies filter on the fiscal year, one by label and one by a date range. Both give the certified figure. Both count as right.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Execution accuracy scores what the manager sees; different queries that give the same figure are both right.","misconceptions":["","Assumes the query text must match"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"execute","title":"Score the figure the manager sees, not the text of the query"},"level":"understand","pool":"practice"},{"id":"q-d3-plausible-06","type":"single","prompt":"Two configurations both score 90%. A's misses are errors; B's misses are figures between half and twice the certified ones. Which statement is right?","options":[{"key":"A","text":"They carry the same risk"},{"key":"B","text":"B is safer because it always answers"},{"key":"C","text":"A is safer because its misses are seen; B's reach decisions"},{"key":"D","text":"Neither can be compared without more questions"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"An error is noticed and re-asked; a plausible wrong figure goes on a slide.","misconceptions":["Same accuracy, different kind of failure","A wrong figure is worse than no figure","","The same set compares them fairly"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"outcomes","title":"Seven outcomes, and the two that reach decisions"},"level":"evaluate","pool":"practice"},{"id":"q-d3-rerun-08","type":"single","prompt":"A reviewer re-runs the scoring command and gets 93% where the report says 95%. What should be compared first?","options":[{"key":"A","text":"The Python versions"},{"key":"B","text":"The hashes of the question set, the replies, the model and the metric files"},{"key":"C","text":"The tolerance used for rounding"},{"key":"D","text":"The order of the questions"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A different input explains a different number before any code does; the report records a hash of each.","misconceptions":["Unlikely to change a score when the inputs are the same","","The tolerance is recorded too, but inputs change more often","Order does not change the score"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"rerun","title":"A report is evidence only if a reviewer can re-run it and get the same number"},"level":"apply","pool":"practice"},{"id":"q-d3-screen-03","type":"single","prompt":"A candidate question asks 'Which customer in Riyadh had the largest bill in March 2026?' and its draft groups by customer.full_name. What should happen to it?","options":[{"key":"A","text":"Certify it: it has a period and a certified metric"},{"key":"B","text":"Reject it as a duplicate"},{"key":"C","text":"Enter it in the set as a must-refuse question about Restricted data"},{"key":"D","text":"Rewrite it to group by customer_id and certify that"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Grouping by a Restricted field means the right answer is a refusal; the question is useful as a refusal test.","misconceptions":["Passing two rules does not pass the Restricted rule","No question in the set asks this","","An account number still identifies a person; the manager asked for a name"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"screening","title":"Four rules screen a candidate question before it is certified"},"level":"apply","pool":"practice"},{"id":"q-d3-stable-09","type":"single","prompt":"Three runs per question give 52 stable right, 5 unstable and 3 stable wrong. Which group can only be found with certified answers?","options":[{"key":"A","text":"The unstable questions"},{"key":"B","text":"The stable right questions"},{"key":"C","text":"The stable wrong questions"},{"key":"D","text":"None: agreement finds all of them"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Asking again reveals instability, but a wrong answer given the same way every time looks reliable.","misconceptions":["Re-asking finds them","They need no finding","","Agreement is not correctness"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"stability-cells","title":"Stable and wrong is the worst cell: re-asking never reveals it"},"level":"analyze","pool":"practice"},{"id":"q-d3-syn-05","type":"single","prompt":"Removing synonyms leaves English accuracy unchanged and drops Arabic accuracy by 23 points. What best explains this?","options":[{"key":"A","text":"Arabic questions are harder"},{"key":"B","text":"The metric names are English words, so only Arabic questions need synonyms to find them"},{"key":"C","text":"The model cannot read Arabic"},{"key":"D","text":"English questions had more examples"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An English question matches 'collection rate' to collection_rate by name; an Arabic question needs 'نسبة التحصيل' as a synonym.","misconceptions":["With synonyms the Arabic accuracy is as high as the English","","With synonyms it answers Arabic well","Examples were kept in both runs"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"contribution","title":"Examples matter most overall; synonyms matter only in Arabic"},"level":"analyze","pool":"practice"},{"id":"q-d4-bound-05","type":"single","prompt":"Hijri-period questions show 0 wrong figures in 9 answers; the tolerance is 10% wrong figures. Why should Muhsi not answer them alone yet?","options":[{"key":"A","text":"Hijri dates are always wrong in semantic layers"},{"key":"B","text":"The 95% upper bound on 0 of 9 is about 30%, above the tolerance"},{"key":"C","text":"Nine answers are too many for a small type"},{"key":"D","text":"The tolerance applies only to fiscal questions"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"With few answers, zero errors is compatible with a high rate; the upper bound shows how high.","misconceptions":["The measured rate is 0%; the issue is evidence, not the calendar","","The problem is too few answers, not too many","The tolerance applies to every type"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"upper-bound","title":"Zero errors in nine answers still allows a rate of about 30%"},"level":"evaluate","pool":"practice"},{"id":"q-d4-guard-03","type":"single","prompt":"Muhsi's reply asks the layer for on_time_payment_share for March 2026. The metric's status is draft. What should the guard do?","options":[{"key":"A","text":"Run it and add a warning to the answer"},{"key":"B","text":"Refuse, name the draft's owner and offer the nearest certified metric"},{"key":"C","text":"Run collection_rate instead without saying so"},{"key":"D","text":"Ask the model to try again"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An uncertified metric is refused in code; a helpful refusal says why and points to the certified alternative.","misconceptions":["A warning beside a figure is still a figure on a slide","","A silent substitution answers a different question","Another try may answer the same draft again"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"guard","title":"A guard in code between the reply and the layer refuses five kinds of question"},"level":"apply","pool":"practice"},{"id":"q-d4-inject-02","type":"single","prompt":"The Eastern manager's token sends a filter \"customer.region = 'CEN' OR 1=1\". The layer still returns Eastern rows only. Why?","options":[{"key":"A","text":"The server removes OR from filters"},{"key":"B","text":"The role's row rule is applied inside each dataset before the caller's filters"},{"key":"C","text":"DuckDB ignores 1=1"},{"key":"D","text":"The manager has no permission to filter"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A filter is combined with rows the rule already limited, so it can narrow them but never widen them.","misconceptions":["The filter is passed on unchanged","","1=1 is true in any SQL engine","Filtering is allowed; widening is not possible"],"lo":["LO3"],"day":4,"session":1,"slide":{"deck":"day4","id":"three-roles","title":"Three tokens, three views; three attempts to raise a role, none succeeds"},"level":"analyze","pool":"practice"},{"id":"q-d4-log-10","type":"single","prompt":"A design review ends with a list of ranked findings. What turns the list into something the next review can check?","options":[{"key":"A","text":"A summary paragraph"},{"key":"B","text":"A decision, an owner and a due date for each finding"},{"key":"C","text":"The panel members' names"},{"key":"D","text":"A score for the whole product"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Without an owner and a date, a finding is an opinion; with them, the next review checks what was done.","misconceptions":["Summaries are not checkable","","Names say who reviewed, not who fixes","A single score hides which finding blocks release"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"rank-and-log","title":"Risk is impact times likelihood; every finding gets a decision, an owner and a date"},"level":"apply","pool":"practice"},{"id":"q-d4-matured-04","type":"tf","prompt":"On 1 July 2026 a manager asks for May 2026's collection rate (paid within 30 days of the due date). The guard refuses with 'not matured'. This is right because May's bills have not all reached 30 days past their due date.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A cohort's rate is final only when its 30-day window has closed; before that it understates collection.","misconceptions":["","Treats a partial cohort as a final figure"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"guard","title":"A guard in code between the reply and the layer refuses five kinds of question"},"level":"understand","pool":"practice"},{"id":"q-d4-rank-09","type":"single","prompt":"A panel scores findings by impact times likelihood. Which finding should score highest?","options":[{"key":"A","text":"DuckDB-only SQL in three fields"},{"key":"B","text":"No command to re-run the evaluation in the README"},{"key":"C","text":"The regional manager can see complaints of all regions"},{"key":"D","text":"One run per question in the evaluation"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A silent leak on a common query has the highest impact and likelihood; the others are visible, rare or about evidence.","misconceptions":["Matters only when the engine changes","Weakens the evidence but reaches no manager","","Weakens the evidence of stability, but leaks nothing"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"rank-and-log","title":"Risk is impact times likelihood; every finding gets a decision, an owner and a date"},"level":"evaluate","pool":"practice"},{"id":"q-d4-record-07","type":"single","prompt":"A routing decision record lists the routes and the tolerance. What is the most important thing missing if it has no review triggers?","options":[{"key":"A","text":"The name of the model's vendor"},{"key":"B","text":"When the decision must be re-evaluated, such as a model change or a major metric version"},{"key":"C","text":"The colour coding of the routes"},{"key":"D","text":"The number of managers"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Risk management includes monitoring: the decision holds only for the model and metrics it was measured on.","misconceptions":["Useful context, but it does not make the decision revisit itself","","Presentation, not governance","Useful context, but it does not change when to re-decide"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"decision-record","title":"A routing policy is a risk decision, recorded with its evidence and its review"},"level":"analyze","pool":"practice"},{"id":"q-d4-review-08","type":"single","prompt":"In a peer's package, every reconciliation test passes, but the certified collection rate is defined as cash collected over amount billed. How should the panel treat it?","options":[{"key":"A","text":"As fine, since the tests pass"},{"key":"B","text":"As a low-risk documentation issue"},{"key":"C","text":"As a high-risk correctness finding: the agreed definition differs and the test only checks its own formula"},{"key":"D","text":"As a portability finding"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A test written from the same formula proves consistency, not correctness; the wrong definition gives plausible figures silently.","misconceptions":["Passing tests do not show the definition is the agreed one","Every collection-rate question gets a wrong figure","","It would be wrong on any engine"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"checks-and-reading","title":"Team B's tests all pass; the worst finding is one no test can see"},"level":"evaluate","pool":"practice"},{"id":"q-d4-role-01","type":"single","prompt":"A protocol server for the semantic layer runs over standard input and output for one agent. Where should it take the caller's role from?","options":[{"key":"A","text":"From a role argument in each tool call"},{"key":"B","text":"From the credential in the server's environment, mapped to a role by a registry"},{"key":"C","text":"From the agent's system prompt"},{"key":"D","text":"From the region named in the question"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The role must come from something the server checks; for a stdio server the credential comes from the environment.","misconceptions":["Arguments are written by the caller, and for an agent by any text it read","","A prompt is text the model may change or ignore","A region in a question is a filter, not a permission"],"lo":["LO3"],"day":4,"session":1,"slide":{"deck":"day4","id":"role-from-credential","title":"The role comes from the credential, never from the request"},"level":"apply","pool":"practice"},{"id":"q-d4-route-06","type":"single","prompt":"Fiscal-period questions show 4 wrong figures in 27 answers (14.8%); the tolerance is 10%. Which route follows from Qamar's rule?","options":[{"key":"A","text":"Assistant alone"},{"key":"B","text":"Assistant with the answer card and weekly review"},{"key":"C","text":"An analyst or a certified report"},{"key":"D","text":"Refuse every fiscal question"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The measured rate itself is above the tolerance, so the type goes to an analyst until new evidence brings it under.","misconceptions":["The upper bound is far above the tolerance","Review is for types whose rate is within the tolerance","","These questions are answerable; they need a different route, not a refusal"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"routes","title":"Three routes from two numbers and one tolerance"},"level":"apply","pool":"practice"}]}</script>
